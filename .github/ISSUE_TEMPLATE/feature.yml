name: Feature request
description: Propose a product or engineering feature
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should the feature accomplish?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true for this feature to be complete?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Relevant product, technical, or design context.
    validations:
      required: false
